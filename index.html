<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EPAM</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        color: #1f2937;
        background: #fff;
        font-family: Arial, Helvetica, sans-serif;
      }

      h1 {
        max-inline-size: 100%;
        margin: 0;
        font-size: clamp(1rem, 10vw, 3rem);
        text-align: center;
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <h1>&lt;EPAM&gt;</h1>
  </body>
</html>
